[workspace]
resolver = "2"
members = [
    "rs-matter-embassy",
]

exclude = ["examples"]

[patch.crates-io]
rs-matter = { git = "https://github.com/project-chip/rs-matter" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack" }
mbedtls-rs-sys = { git = "https://github.com/esp-rs/mbedtls-rs" }
openthread = { git = "https://github.com/esp-rs/openthread" }
openthread-sys = { git = "https://github.com/esp-rs/openthread" }
# Unreleased work on the `bt-hci-010` branches (bt-hci 0.10, released nrf-mpsl/nrf-sdc)
nimble-rs = { git = "https://github.com/sysgrok/nimble-rs", branch = "bt-hci-010" }
nimble-rs-sys = { git = "https://github.com/sysgrok/nimble-rs", branch = "bt-hci-010" }
nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154", branch = "bt-hci-010" }
nrf-802154-sys = { git = "https://github.com/sysgrok/nrf-802154", branch = "bt-hci-010" }

esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }

[profile.release]
opt-level = "z"

[profile.dev]
debug = true
opt-level = "z"
