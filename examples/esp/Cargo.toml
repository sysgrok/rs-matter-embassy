[package]
name = "rs-matter-embassy-esp-examples"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "light_wifi"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_wifi_persistent"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_eth"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_eth2"
required-features = ["thread"]
harness = false

[[bin]]
name = "light_thread"
required-features = ["thread"]
harness = false

[[bin]]
name = "light_thread_coex"
required-features = ["thread"]
harness = false

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[patch.crates-io]
#rs-matter = { git = "https://github.com/project-chip/rs-matter" }
#rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack" }
#mbedtls-rs-sys = { git = "https://github.com/esp-rs/mbedtls-rs" }
#openthread = { git = "https://github.com/esp-rs/openthread" }
#openthread-sys = { git = "https://github.com/esp-rs/openthread" }
#nimble-rs = { git = "https://github.com/sysgrok/nimble-rs" }
#nimble-rs-sys = { git = "https://github.com/sysgrok/nimble-rs" }
#nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154" }
#nrf-802154-sys = { git = "https://github.com/sysgrok/nrf-802154" }

esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }

[features]
default = ["esp32c6", "trouble"]
trouble = ["rs-matter-embassy/trouble"]
nimble = ["rs-matter-embassy/nimble"]
esp32 = ["esp-rtos/esp32", "esp-hal/esp32", "esp-backtrace/esp32", "esp-println/esp32", "esp-radio/esp32", "esp-storage/esp32", "esp-bootloader-esp-idf/esp32", "esp-metadata-generated/esp32", "portable-atomic/critical-section", "wifi"]
esp32c2 = ["esp-rtos/esp32c2", "esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-radio/esp32c2", "esp-storage/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp-metadata-generated/esp32c2", "portable-atomic/critical-section", "wifi"]
esp32c3 = ["esp-rtos/esp32c3", "esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-radio/esp32c3", "esp-storage/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-metadata-generated/esp32c3", "portable-atomic/unsafe-assume-single-core", "wifi"]
esp32c6 = ["esp-rtos/esp32c6", "esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6", "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-metadata-generated/esp32c6", "portable-atomic/critical-section"]
esp32s3 = ["esp-rtos/esp32s3", "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-metadata-generated/esp32s3", "portable-atomic/critical-section", "wifi"]
esp32h2 = ["esp-rtos/esp32h2", "esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-radio/esp32h2", "esp-storage/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-metadata-generated/esp32h2", "portable-atomic/critical-section", "thread"]
wifi = ["rs-matter-embassy/embassy-net", "rs-matter-embassy/rustcrypto"]
thread = ["rs-matter-embassy/openthread", "rs-matter-embassy/mbedtls", "rs-matter-embassy/openthread-heap-int-8192"]

[dependencies]
log = "0.4"
embassy-executor = "0.10"
embassy-embedded-hal = "0.6"
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }
esp-hal = { version = "~1.2", features = ["log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy"] }
esp-alloc = { version = "0.11" }
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["ble", "log-04", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04"] }
esp-metadata-generated = "0.5"
# `default-features = false`: the BLE host backend is selected by this crate's `trouble` /
# `nimble` features instead, as the `trouble` default would collide with `nimble`. Everything
# else the defaults used to bring in (`rustcrypto`) is named explicitly.
rs-matter-embassy = { path = "../../rs-matter-embassy", version = "0.1", default-features = false, features = ["esp", "log"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }
embassy-futures = "0.1"
embassy-time = "0.5"
embassy-sync = "0.8"
static_cell = "2"
portable-atomic = "1"
