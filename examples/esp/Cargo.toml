[package]
name = "rs-matter-embassy-esp-examples"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "light_wifi"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_wifi_persistent"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_eth"
required-features = ["wifi"]
harness = false

[[bin]]
name = "light_eth2"
required-features = ["thread"]
harness = false

[[bin]]
name = "light_thread"
required-features = ["thread"]
harness = false

[[bin]]
name = "light_thread_coex"
required-features = ["thread"]
harness = false

[[bin]]
name = "trv_battery_thread"
required-features = ["thread", "case-resumption"]
harness = false

[[bin]]
name = "temp_sensor_battery_thread"
required-features = ["thread", "case-resumption", "persistent-subscriptions"]
harness = false

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
opt-level = "s"
overflow-checks = false

[patch.crates-io]
#nimble-rs = { git = "https://github.com/sysgrok/nimble-rs" }
#nimble-rs-sys = { git = "https://github.com/sysgrok/nimble-rs" }

esp-hal = { git = "https://github.com/esp-rs/esp-hal" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal" }
esp-println = { git = "https://github.com/esp-rs/esp-hal" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal" }
esp-phy = { git = "https://github.com/esp-rs/esp-hal" }
esp-sync = { git = "https://github.com/esp-rs/esp-hal" }
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal" }
esp-hal-procmacros = { git = "https://github.com/esp-rs/esp-hal" }
esp-riscv-rt = { git = "https://github.com/esp-rs/esp-hal" }
xtensa-lx-rt = { git = "https://github.com/esp-rs/esp-hal" }

# embassy-net on `main` runs on `xarxa`. Everything that hands it a driver has to come from
# `main` as well, and so do the embassy crates they share types with, or that may be linked only
# once (`embassy-time-driver`, `embassy-time-queue-utils`). Not `embassy-sync`: `main` has breaking
# changes that `esp-hal` does not build with, and two copies of it work side by side
embassy-net = { git = "https://github.com/embassy-rs/embassy" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy" }
embassy-time = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy" }

[features]
default = ["esp32c6", "trouble"]
trouble = ["rs-matter-embassy/trouble"]
nimble = ["rs-matter-embassy/nimble"]
esp32 = ["esp-rtos/esp32", "esp-hal/esp32", "esp-backtrace/esp32", "esp-println/esp32", "esp-radio/esp32", "esp-bootloader-esp-idf/esp32", "esp-metadata-generated/esp32", "portable-atomic/critical-section", "wifi"]
esp32c2 = ["esp-rtos/esp32c2", "esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-radio/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp-metadata-generated/esp32c2", "portable-atomic/critical-section", "wifi"]
esp32c3 = ["esp-rtos/esp32c3", "esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-radio/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-metadata-generated/esp32c3", "portable-atomic/unsafe-assume-single-core", "wifi"]
esp32c6 = ["esp-rtos/esp32c6", "esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-metadata-generated/esp32c6", "openthread-driver-esp?/esp32c6", "portable-atomic/critical-section"]
esp32s3 = ["esp-rtos/esp32s3", "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-metadata-generated/esp32s3", "portable-atomic/critical-section", "wifi"]
esp32h2 = ["esp-rtos/esp32h2", "esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-radio/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-metadata-generated/esp32h2", "openthread-driver-esp?/esp32h2", "portable-atomic/critical-section", "thread"]
wifi = ["rs-matter-embassy/embassy-net", "rs-matter-embassy/rustcrypto"]
thread = ["rs-matter-embassy/esp-thread", "rs-matter-embassy/mbedtls", "rs-matter-embassy/openthread-heap-int-8192", "dep:openthread-driver-esp"]
# A Seeed XIAO ESP32-C6 board: power its RF switch and connect the onboard antenna, without which
# the radio hardly reaches anything.
xiao = []
# Resume CASE sessions across reboots and sleeps instead of a full Sigma1/2/3 handshake: saves
# radio time on every wake-up of a battery device, and the persisted records are small.
case-resumption = ["rs-matter-embassy/case-resumption"]
# Persist the subscriptions, so that a device rebooting on every wake-up (a deep-sleeping ICD)
# resumes reporting without the controller having to subscribe again.
persistent-subscriptions = ["rs-matter-embassy/persistent-subscriptions"]

[dependencies]
log = "0.4"
embassy-executor = "0.10"
embassy-embedded-hal = "0.6"
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }
esp-hal = { version = "~1.2", features = ["log-04", "unstable", "exception-handler"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy"] }
esp-alloc = { version = "0.11" }
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["ble", "log-04", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04", "embedded-storage"] }
esp-metadata-generated = "0.6"
# `default-features = false`: the BLE host backend is selected by this crate's `trouble` /
# `nimble` features instead, as the `trouble` default would collide with `nimble`. Everything
# else the defaults used to bring in (`rustcrypto`) is named explicitly.
rs-matter-embassy = { path = "../../rs-matter-embassy", version = "0.1", default-features = false, features = ["esp", "log"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }
static_cell = "2"
# The IEEE 802.15.4 radio of the chip, for Thread: only for selecting the chip on it, which
# `rs-matter-embassy` cannot do
openthread-driver-esp = { version = "0.1", optional = true }
portable-atomic = "1"
