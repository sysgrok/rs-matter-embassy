[package]
name = "rs-matter-embassy-nrf-examples"
version = "0.1.0"
edition = "2021"
resolver = "2"

# Both examples below drive the `embassy-nrf` IEEE 802.15.4 radio directly, which
# only exists on the nRF52 family. All but `trv_battery_thread` log over RTT only.
[[bin]]
name = "light_thread"
harness = false
required-features = ["nrf52840", "log-rtt"]

[[bin]]
name = "light_thread_coex"
harness = false
required-features = ["log-rtt"]

[[bin]]
name = "trv_battery_thread"
required-features = ["case-resumption"]

[[bin]]
name = "light_eth"
harness = false
required-features = ["nrf52840", "log-rtt"]

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
debug = 2
debug-assertions = false
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = false

[patch.crates-io]
rs-matter = { git = "https://github.com/project-chip/rs-matter" }
#rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "csl" }
#mbedtls-rs-sys = { git = "https://github.com/esp-rs/mbedtls-rs" }
#openthread = { git = "https://github.com/esp-rs/openthread" }
#openthread-sys = { git = "https://github.com/esp-rs/openthread" }
#openthread = { git = "https://github.com/sysgrok/openthread", branch = "csl" }
#openthread-sys = { git = "https://github.com/sysgrok/openthread", branch = "csl" }
# TEMP: local checkouts carrying the uncommitted power fixes
openthread = { path = "../../../openthread/openthread" }
openthread-sys = { path = "../../../openthread/openthread-sys" }
#nimble-rs = { git = "https://github.com/sysgrok/nimble-rs" }
#nimble-rs-sys = { git = "https://github.com/sysgrok/nimble-rs" }
#nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154" }
#nrf-802154-sys = { git = "https://github.com/sysgrok/nrf-802154" }
# TEMP: local checkout carrying the uncommitted HP timer fix
#nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154", branch = "csl" }
#nrf-802154-sys = { git = "https://github.com/sysgrok/nrf-802154", branch = "csl" }
nrf-802154 = { path = "../../../nrf-802154/nrf-802154" }
nrf-802154-sys = { path = "../../../nrf-802154/nrf-802154-sys" }

[features]
default = ["nrf52840", "trouble", "log-rtt"]
# defmt logs over RTT, i.e. through the debug probe.
log-rtt = ["rtt-target/defmt"]
# defmt logs over UART instead (`trv_battery_thread` on the nRF52840 only), for measuring the
# power draw: RTT needs an attached debugger, which keeps the chip's debug power domain on.
# TX only, on P1.11 (the XIAO nRF52840's D6), 115200 baud. It replaces `log-rtt`, so build it
# with `--no-default-features`.
log-uart = ["dep:critical-section"]
# The Seeed XIAO nRF52840 board (`trv_battery_thread` only): run the core supply off the chip's
# DC/DC converter (the XIAO has its inductor), and put its onboard QSPI flash, which the example
# does not use, into deep power-down instead of leaving its chip select floating.
xiao = []
# Resume CASE sessions instead of a full handshake: saves radio time on every wake-up of a
# battery device (see `trv_battery_thread`).
case-resumption = ["rs-matter-embassy/case-resumption"]
trouble = ["rs-matter-embassy/trouble"]
nimble = ["rs-matter-embassy/nimble"]
nrf52840 = ["rs-matter-embassy/nrf52840", "embassy-nrf/nrf52840", "embassy-nrf/time-driver-rtc1"]
# `unstable-pac` is for the GRTC scrub in `light_thread_coex`, which has to run
# before `embassy_nrf::init`.
nrf54l15 = ["rs-matter-embassy/nrf54l15-app-s", "embassy-nrf/nrf54l15-app-s", "embassy-nrf/time-driver-grtc", "embassy-nrf/unstable-pac"]

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime-ms"] }
embassy-nrf = { version = "0.11", features = ["defmt", "time"], default-features = false }
embassy-futures = "0.1.1"
embassy-sync = { version = "0.8", features = ["defmt"] }
defmt = "1"
embedded-alloc = "0.7"
rs-matter-embassy = { path = "../../rs-matter-embassy", version = "0.1", default-features = false, features = ["openthread", "defmt", "mbedtls", "openthread-heap-int-8192"] }
# The CSL receiver (a Synchronized Sleepy End Device): without it OpenThread drops the radio's
# timed-receive capability, and `trv_battery_thread` polls its parent instead of listening.
openthread = { version = "0.4", default-features = false, features = ["csl-receiver"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["alloc", "strstr", "strcmp", "strncmp", "isupper", "memchr", "utoa", "strtoul"] }

cortex-m = "0.7.6"
cortex-m-rt = "0.7"

rtt-target = "0.6"
panic-rtt-target = "0.2"

static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
critical-section = { version = "1", optional = true }
