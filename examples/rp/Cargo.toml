[package]
name = "rs-matter-embassy-rp-examples"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "light_wifi"
harness = false

[[bin]]
name = "light_eth"
harness = false

# "s" rather than "z" in both profiles: under minsize, LLVM (23+) lowers
# unaligned accesses on thumbv6m to `__aeabi_uread4`-style libcalls, which
# Rust's compiler-builtins does not provide.

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
debug-assertions = false
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = false

[patch.crates-io]
#nimble-rs = { git = "https://github.com/sysgrok/nimble-rs" }
#nimble-rs-sys = { git = "https://github.com/sysgrok/nimble-rs" }

# embassy-net on `main` runs on `xarxa`. Everything that hands it a driver has to come from
# `main` as well, and so do the embassy crates they share types with, or that may be linked only
# once (`embassy-time-driver`, `embassy-time-queue-utils`). Not `embassy-sync`: `main` has breaking
# changes that `esp-hal` does not build with, and two copies of it work side by side
embassy-net = { git = "https://github.com/embassy-rs/embassy" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy" }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy" }
embassy-time = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy" }
cyw43 = { git = "https://github.com/embassy-rs/embassy" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy" }

[features]
default = ["trouble", "rp2040"]
# Chip selection; enable exactly one and build for the matching target:
#   rp2040  -> thumbv6m-none-eabi        (Raspberry Pi Pico / Pico W)
#   rp235xa -> thumbv8m.main-none-eabihf (Raspberry Pi Pico 2 / Pico 2 W)
#   rp235xb -> thumbv8m.main-none-eabihf (RP2350B, QFN-80)
rp2040 = ["embassy-rp/rp2040", "rs-matter-embassy/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rs-matter-embassy/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "rs-matter-embassy/rp235xb"]
skip-cyw43-firmware = []
trouble = ["rs-matter-embassy/trouble"]
# NimBLE makes bounded C-heap allocations, so it needs the C malloc family, which
# `tinyrlibc` provides on top of the Rust global allocator (`embedded-alloc`, set up in each
# binary). `trouble` needs no C heap, hence the dependency riding on this feature only.
nimble = ["rs-matter-embassy/nimble", "dep:tinyrlibc"]

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime-ms"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }
defmt = "1"
embedded-alloc = "0.7"
tinyrlibc = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
rs-matter-embassy = { path = "../../rs-matter-embassy", default-features = false, features = ["embassy-net", "rp", "defmt", "rustcrypto"] }

# Wireless examples
bt-hci = { version = "0.10", default-features = false, features = ["defmt"] }
cyw43 = { version = "0.7", features = ["firmware-logs", "defmt", "bluetooth"] }
cyw43-pio = "0.10"

# W5500 Ethernet examples
embassy-net-wiznet = { version = "0.3", features = ["defmt"] }
embedded-hal-bus = { version = "0.1", features = ["async"] }

cortex-m = "0.7.6"
cortex-m-rt = "0.7"

rtt-target = { version = "0.6", features = ["defmt"] }
panic-rtt-target = "0.2"

static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[build-dependencies]
reqwest = { version = "0.12.9", features = ["blocking"]}
