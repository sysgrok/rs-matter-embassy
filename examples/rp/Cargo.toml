[package]
name = "rs-matter-embassy-rp-examples"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "light_wifi"
harness = false

[[bin]]
name = "light_eth"
harness = false

# "s" rather than "z" in both profiles: under minsize, LLVM (23+) lowers
# unaligned accesses on thumbv6m to `__aeabi_uread4`-style libcalls, which
# Rust's compiler-builtins does not provide.

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
debug-assertions = false
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = false

[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy", rev = "a18084f6e0c7f0756e4d96bd988ed78455ba1a74" }

trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "652fe9633db5be92b98136690e4a0ad9d9bb133f" }

nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a" }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a" }
nrf-802154 = { git = "https://github.com/sysgrok/nrf-802154" }

[features]
default = ["trouble"]
skip-cyw43-firmware = []
trouble = ["rs-matter-embassy/trouble"]
# NimBLE makes bounded C-heap allocations, so it needs the C malloc family, which
# `tinyrlibc` provides on top of the Rust global allocator (`embedded-alloc`, set up in each
# binary). `trouble` needs no C heap, hence the dependency riding on this feature only.
nimble = ["rs-matter-embassy/nimble", "dep:tinyrlibc"]

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime-ms"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }
defmt = "1"
embedded-alloc = "0.7"
tinyrlibc = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
rs-matter-embassy = { path = "../../rs-matter-embassy", default-features = false, features = ["embassy-net", "rp", "defmt", "rustcrypto"] }

# Wireless examples
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }
cyw43 = { version = "0.7", features = ["firmware-logs", "defmt", "bluetooth"] }
cyw43-pio = "0.10"

# W5500 Ethernet examples
embassy-net-wiznet = { version = "0.3", features = ["defmt"] }
embedded-hal-bus = { version = "0.1", features = ["async"] }
rand_core = "0.9"

cortex-m = "0.7.6"
cortex-m-rt = "0.7"

rtt-target = { version = "0.6", features = ["defmt"] }
panic-rtt-target = "0.2"

static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[build-dependencies]
reqwest = { version = "0.12.9", features = ["blocking"]}
